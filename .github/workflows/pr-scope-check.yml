# Generated by engineering-ruleset-plugin. Re-run the sync to update it;
# local edits are overwritten.
#
# Reads the ticket from ClickUp (taskSync.provider), asks an AI whether the
# PR's changes stay within that ticket's scope, and blocks the merge if not.
name: PR Scope Check

on:
  pull_request:
    # The branches a PR can TARGET for this check to run — every environment
    # declared in ruleset-config.json.
    branches:
      - 'dev'
      - 'test'
    types: [opened, synchronize, reopened, edited]

# Cancel an in-flight run when the PR is updated again
concurrency:
  group: scope-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write # to post the sticky comment

jobs:
  # This job id IS the required status check context named by the
  # PR-SCOPE-CHECK ruleset. Renaming it silently blocks every merge.
  scope-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run scope check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

          # ---- AI provider ----
          AI_PROVIDER: "openrouter"
          # Keep this on a model the key can actually run: a free-tier id that
          # answers with an empty completion reaches FAIL_OPEN_ON_ERROR=false
          # and blocks every PR.
          AI_MODEL: "qwen/qwen3-coder"
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

          # ---- issue tracker (from taskSync.provider) ----
          ISSUE_PROVIDER: "clickup"
          CLICKUP_TOKEN: ${{ secrets.CLICKUP_TOKEN }}

          # ---- behaviour ----
          REQUIRE_TASK: "true"
          FAIL_OPEN_ON_ERROR: "false"
          MAX_DIFF_CHARS: "60000"
          AUTO_CLOSE_OUT_OF_SCOPE: "true"
        run: node .github/scripts/scope-check.mjs
