# Generated by engineering-ruleset-plugin. Re-run the sync to update it;
# local edits are overwritten.
#
# Scans the repository with Trivy (vuln, secret, misconfig) and fails the check on
# CRITICAL findings in the files this pull request touched.
# Everything else is reported in the pull request without blocking it.
name: Trivy Security

on:
  pull_request:
    # The branches a PR can TARGET for this scan to run — every environment
    # declared in ruleset-config.json.
    branches:
      - 'dev'
      - 'test'
    types: [opened, synchronize, reopened]

concurrency:
  group: trivy-security-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write # to post the sticky comment

jobs:
  # This job id IS the required status check context named by the
  # TRIVY-SECURITY ruleset. Renaming it silently blocks every merge.
  trivy-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The changed-file list the blocking decision needs is not available
          # from a shallow clone.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # continue-on-error: the scan step's own exit code is not the gate — the
      # report script is, because only it knows the scope and threshold. Without
      # this, a findings-present exit would fail the job before the author is
      # ever told what was found.
      - name: Run Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: trivy-report.json
          scanners: 'vuln,secret,misconfig'
          severity: 'CRITICAL,HIGH,MEDIUM'
          ignore-unfixed: 'true'
          skip-dirs: 'node_modules,dist,build,vendor'
          timeout: '10m'

      - name: Report and gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TRIVY_REPORT: trivy-report.json
          BLOCK_ON: "CRITICAL"
          BLOCK_SCOPE: "changed-files"
          SCANNERS: "vuln,secret,misconfig"
          IGNORE_UNFIXED: "true"
        run: node .github/scripts/trivy-report.mjs
